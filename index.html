<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>UNDERCOVER — Hitman Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.2" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </svg>

  <div class="grain-overlay"></div>
  <div class="scanline-overlay"></div>

  <div id="burn-overlay" class="burn-overlay hidden">
    <div class="burn-text">🔥 COVER BLOWN — GOING DARK 🔥</div>
  </div>

  <div id="minigame-overlay" class="minigame-overlay hidden">
    <div class="minigame-modal">
      <div class="minigame-title" id="mg-title"></div>
      <div class="minigame-flavor" id="mg-flavor"></div>
      <div class="mg-loadout" id="mg-loadout"></div>
      <div class="minigame-body" id="mg-body"></div>
      <button class="btn sell" id="mg-skip">Skip (small penalty)</button>
    </div>
  </div>

  <div id="phone-widget">
    <button id="phone-toggle" class="phone-toggle" title="Burner Phone">📱</button>
    <div id="phone-panel" class="phone-panel hidden">
      <div class="iphone-frame">
        <div class="iphone-island"></div>
        <div class="phone-screen">
          <div class="iphone-statusbar">
            <span class="iphone-time">9:41</span>
            <div class="iphone-statusbar-icons">
              <div class="iphone-signal"><span></span><span></span><span></span><span></span></div>
              <span class="iphone-5g">5G</span>
              <div class="iphone-battery"><div class="iphone-battery-fill"></div></div>
            </div>
          </div>
          <div class="phone-header">
            <button id="phone-back" class="phone-back hidden">‹</button>
            <span id="phone-title" class="phone-title">Contacts</span>
            <button id="phone-close" class="phone-close">×</button>
          </div>
          <div id="phone-body" class="phone-body"></div>
        </div>
        <div class="iphone-home-indicator"></div>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <button id="nav-toggle" class="nav-toggle" title="Menu">☰ MENU</button>
      <div class="logo-block">
        <h1 class="logo">UNDERCOVER<span>.</span></h1>
        <div class="case-id">FILE NO. 88-UC &nbsp;·&nbsp; STATUS: <span class="case-id-active">ACTIVE</span></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-title">Sections</div>
    <button class="tab-btn active" data-tab="contracts">Case Files</button>
    <button class="tab-btn" data-tab="arsenal">Armory</button>
    <button class="tab-btn" data-tab="flex">Assets</button>
    <button class="tab-btn" data-tab="businesses">Businesses</button>
    <button class="tab-btn" data-tab="rivals">Rivals</button>
    <button class="tab-btn" data-tab="crypto">Crypto</button>
    <button class="tab-btn" data-tab="bank">Bank</button>
    <button class="tab-btn" data-tab="casino">Casino</button>
    <button class="tab-btn" data-tab="housing">Property</button>
    <button class="tab-btn" data-tab="world">World</button>
    <button class="tab-btn" data-tab="laylow">Lay Low</button>
    <button class="tab-btn" data-tab="profile">Vault</button>
  </nav>

  <main class="layout">
    <section class="panel main-panel" id="tab-content"></section>
    <aside class="panel log-panel">
      <h2>Field Log<span class="cursor-blink">_</span></h2>
      <div id="log"></div>
    </aside>
  </main>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
